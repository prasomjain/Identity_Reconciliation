databases:
  - name: bitespeed-db
    plan: free
    databaseName: bitespeed
    user: bitespeed

services:
  - type: web
    name: bitespeed-identity
    plan: free
    runtime: node
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bitespeed-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
